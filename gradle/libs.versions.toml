[versions]
core = "1.17.0"
coroutines = "1.10.2"
desugar = "2.1.5"
gradle = "8.13.2"
injekt = "4135455a2a"
#noinspection NewerVersionAvailable
jsoup = "1.17.2"
kotlin = "2.2.10"
okhttp = "5.3.2"
okio = "3.17.0"
preference = "1.2.1"
rxjava = "1.3.8"
serialization = "1.11.0"
tsuki = "1.0.5"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version.ref = "injekt" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "serialization" }
kotlinx-serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
tsuki = { module = "com.github.UsagiApp:Tsuki", version.ref = "tsuki" }

[plugins]
android-library = { id = "com.android.library", version.ref = "gradle" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinx-serizliation = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
